[package]
name = "document-reader"
version = "0.1.0"
description = "Local-first personal library document reader"
edition = "2021"
rust-version = "1.77"

[lib]
name = "document_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
pdfium-render = "0.8"
image = "0.25"
lru = "0.12"

[dev-dependencies]
tempfile = "3"
