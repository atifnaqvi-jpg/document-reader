[package]
name = "document-reader"
version = "1.1.1"
description = "Local-first personal library document reader"
edition = "2021"
rust-version = "1.90"

[lib]
name = "document_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables the P2.4 fixture builder's `Document::encrypt` path, used ONLY by
# `examples/make_p24_fixtures.rs` to generate `encrypted-aes.pdf`. The product never calls
# `Document::encrypt` (P2.4 T9), and without this feature that code is not compiled at all.
testfixtures = []

[[example]]
name = "make_p24_fixtures"
required-features = ["testfixtures"]

# P2.7.7 §5 row 6: regenerates `type0-shared-font-multi-run.pdf`. Its own binary rather than a
# second array in `make_p24_fixtures`, because that generator's name and doc comment are the
# P2.4 fixture matrix and a phase's fixture should be regenerable without rewriting another
# phase's artefact. The builder itself is shared through `src/editor/testpdf.rs`, so the
# committed file and the in-memory tests cannot drift.
[[example]]
name = "make_p277_fixtures"
required-features = ["testfixtures"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
pdfium-render = { version = "0.8", features = ["sync"] }
image = "0.25"
lru = "0.12"
# XFDF import/export (P3.1 D-A9). Already in the graph transitively via `plist`, so making it
# direct adds no new crate to the build -- only a name we are allowed to depend on.
quick-xml = "0.42"
base64 = "0.22"
lopdf = { version = "0.45", default-features = false, features = ["serde"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# PFX/PKCS#12 import (P3.2 D-SG1, amended 2026-11-08). `pkcs12` itself cannot decrypt a PFX at
# either published version -- it carries a literal decryption TODO -- so the keystore reader is
# `p12-keystore`, which does PBES2/PBKDF2 and verifies the MAC. Cost: a second `der` generation
# in the lock (`der 0.8` here, `der 0.7` under `rsa`). Bounded by design K25: the crate parses and
# decrypts only, and every type leaving `editor::signature::pfx` is raw DER.
p12-keystore = "0.4.1"

[dev-dependencies]
tempfile = "3"
