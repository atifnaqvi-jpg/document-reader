name: CI

# Every branch, not just the ones that end up on `main`.
#
# This used to run only on `push` to main/master and on pull requests. All of P2.7.x and the
# CID phase were developed on the long-lived `p2-windows-test` branch, so this workflow never
# ran on it: the fmt/clippy/vitest results reported for those phases were local runs, never a
# gate. Unformatted code accumulated there for three weeks while the release workflow — which
# runs `cargo test` but not fmt, clippy or vitest — kept building installers from it.
#
# A gate that does not run is not green, so the branch list is gone. `pull_request` is kept
# because a PR still deserves a check before review.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      # Pinned, not `@stable`. rustfmt may change its output between releases, so a floating
      # toolchain turns `cargo fmt --check` into a statement about the calendar rather than
      # about the code: it can go green→red on a day nobody edited anything, or reformat a
      # release branch mid-flight. Pinning is what makes the gate meaningful.
      # `rust-version` in src-tauri/Cargo.toml is the MSRV floor (1.90); this is the toolchain
      # the gates are defined against, and is allowed to be newer.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `--include-ignored` is deliberately omitted here. The product ships Windows-only; Linux
      # is a later phase. The Windows job is the one that runs the full suite with PDFium against
      # the shipping reader, so this job validates the platform-independent majority and nothing
      # more. Do NOT add `--include-ignored` here and do NOT add a PDFium fetch for Linux: the
      # only library that exists is an untracked aarch64 drop on the dev VM, and the runner is
      # x64, so the fetch would produce a file the loader cannot use.
      #
      # Consequence, accepted rather than overlooked: the 81 PDFium-gated tests never execute on
      # Linux, and running this job with `--include-ignored` yields 26 failures, all
      # `PdfiumUnavailable` (measured on the `dd8efce`-era tree, 2026-10-28; the two picker-path
      # tests added since pass with the library and add no failure). That is the recorded state,
      # not a defect to fix here.
      #
      # The counts are asserted for the same reason the Windows job asserts its own. A test
      # that stops being collected -- a malformed attribute, a module that no longer compiles
      # in, a file dropped from the harness -- leaves no trace in a "0 failed" summary. The
      # floor is the number of tests that existed when this gate was written, so removing
      # coverage fails here instead of passing quietly.
      - name: Tests
        working-directory: src-tauri
        run: |
          cargo test 2>&1 | tee /tmp/test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi

          ignored=$(grep -oE '[0-9]+ ignored' /tmp/test-output.txt | awk '{s+=$1} END {print s+0}')
          passed=$(grep -oE '[0-9]+ passed' /tmp/test-output.txt | awk '{s+=$1} END {print s+0}')
          echo "Linux run: $passed passed, $ignored ignored"

          # Exactly the PDFium-gated tests. Fewer means a `#[ignore]` lost its reason and the
          # Windows job is now validating something narrower than this gate assumes; more
          # means a non-PDFium test was skipped, which silently removes coverage on the
          # platform where most of the suite runs. Equal is the only correct answer.
          #
          # This is literal for the same reason: any added `#[ignore]` must be acknowledged
          # here in the same commit, so a gated test cannot arrive -- or vanish -- silently.
          #
          # Measured, not incremented: 87 -- 76 machine-dependent tests, the three PDFium-side Form
          # XObject walk tests added with the recursion, two that compose the picker path
          # (the font search, and describe/edit/save/re-open) after it refused on the live file,
          # and two added with P2.7.7's Type0/CID writer: `row6a` compares rendered pixels of the
          # untouched runs and `row6c` reads the written `/W` against the program's own `hmtx`,
          # so both need a real PDFium. `row6b` is the structural one and is not ignored.
          #
          # Measured at 87, not 83: four more arrived with P2.8's expectation reader. They read
          # PDFium's character grid, which is the whole point of them -- the reflow guard's
          # oracle must be ink, not the writer's own arithmetic -- so none of the four can run
          # here. They are `#[ignore]`d rather than left to fail, because this job has no
          # library to offer them and a failure here would read as a defect in the reader.
          #
          # Measured at 89, not 87: two more with P2.8 case (a), both reflow writes whose oracle
          # is per-glyph ink for the same reason, and both ignored here rather than left to fail.
          #
          # Measured at 91, not 90: T-8's `the_reader_puts_a_kerned_tail_where_pdfium_drew_it_at_tz_50`
          # reads PDFium's glyph grid to check the reader's own pen against the ink at `Tz 50`, so
          # it is `#[ignore]`d here like the rest. T-8's other guard
          # (`the_kern_term_carries_the_horizontal_scale`) builds its text state by hand and needs
          # no library, so it moves `passed` and is counted below.
          #
          # The other tests case (a) brought -- the `Td`-offset arithmetic and the R1/R4/R5/R6
          # refusals -- assert over `measure` and synthesized runs, need no library, and are
          # counted in `passed` below.
          #
          # Measured at 92, not 91: R-4's `a_wider_replacement_moves_the_rest_of_the_line_and_nothing_else`
          # compares three runs' positions against PDFium's per-glyph ink before and after a save,
          # which is the row's oracle by design, so it cannot run here either. It moves this pin
          # and leaves the Linux floor alone.
          #
          # Measured at 93, not 92: T-8b's `a_reflows_reported_tail_origin_matches_the_ink_at_tz_50`
          # compares the reflow's reported `moved_to` against PDFium's glyph origin, which is what
          # the row asks for, so it cannot run without the library. Its hand-built sibling
          # `the_reflows_tail_position_carries_the_horizontal_scale` needs none, and moves the
          # `passed` floor below rather than this pin.
          # Measured at 96, not 93: A-11's three free-text pixel tests
          # (`tests/free_text_appearance.rs`) render a saved annotation through PDFium and
          # count its ink, which is the only way to tell "the stream is legal" from "the user
          # can see the text". They cannot run here for the same reason as the rest.
          # Measured at 101, not 96: P3.2 SCOPE-A's five `tests/protect_save.rs` tests reopen
          # the protected file through PDFium, which is the point -- lopdf wrote it, so asking
          # lopdf to read it back would only prove the two halves agree. They cannot run
          # without the library, so they move this pin. Their three siblings in
          # `tests/protect_ordering.rs` read source text and need no library, so they move the
          # `passed` floor instead.
          # Measured at 106, not 101: P3.2's three `tests/redact_pdfium.rs` oracles and SCOPE-C's two
          # `tests/incremental_pdfium.rs` oracles ask
          # PDFium what the redacted page says and how big it is, which is the whole point --
          # a byte scan we wrote cannot tell "our writer agrees with itself" from "a reader
          # shows nothing". They move this pin; the seven in `tests/redact_content.rs` need no
          # library and move the `passed` floor instead.
          if [ "$ignored" -ne 106 ]; then
            echo "::error::$ignored tests ignored; 106 machine-dependent tests are expected. Add the mark deliberately or fix the test."
            exit 1
          fi
          # Measured, not computed: 489 on Linux without PDFium -- 479 before the MSRV
          # guards and the font table-range check, plus the seven tests that arrived with
          # P2.7.3's PDFium-side walk (three PDFium-side walk tests, two fixture-order
          # guards, and the two regression tests for the interleaved walk). The two
          # picker-path tests are `#[ignore]`d, so they move the ignored count and not this
          # one. Raising this to the measured value rather than leaving headroom is what
          # makes a test that stops being collected fail here instead of passing quietly.
          #
          # Measured at 511, not 489: this file's floor had drifted below the tree, and P2.8
          # case (a) added six non-ignored tests (the `Td`-offset arithmetic, the R1/R4/R5/R6
          # refusals, and the `TJ`-array tag invariant that stands in for R8). The floor was
          # re-measured from the tree rather than incremented, per the same rule that sets the
          # ignored count. R-1b's `R10b` refusal (509 -> 510) is the latest of those, and it is
          # NOT `#[ignore]`d: it builds runs and needs no PDFium, so it moves this floor and
          # leaves the ignored count at 90. R-2a's fixture guard (510 -> 511) is the same shape:
          # it parses a committed fixture's operator list and needs no library either.
          #
          # Measured at 513, not 511: R-2b's two guards (511 -> 513) also parse the committed
          # fixture rather than opening a document through PDFium, so they move this floor and
          # leave the ignored count at 90.
          #
          # Measured at 516, not 513: R-2c added three guards (513 -> 516) -- R5's message and
          # its real-content refusal, the every-variant message table, and the crafted sample
          # that proves that table's source reader can see a defect. All three read a committed
          # `.pdf`/`.rs` with `std::fs`, so none needs PDFium and the ignored count stays 90.
          #
          # Measured at 518, not 516: R-H1 added two guards (516 -> 518) -- the fixture-tree
          # scan and the crafted sample that proves its NUL reader can see a defect. Both call
          # `git` and `std::fs` on the working tree, so neither needs PDFium and the ignored
          # count stays 90.
          #
          #
          # Measured at 530, not 527: R-5 added three non-PDFium guards (527 -> 530) -- the
          # content-box refusal on the near-edge fixture, the content-box resolver's four
          # selection properties, and the resolver's refusal to invent a box. All three call
          # code rather than opening PDFium, so the ignored count stays 92.
          #
          # Measured at 525, not 524: R-7 added
          # `the_parity_matrix_promotes_a10_only_with_a_recorded_installer`, which reads the
          # parity matrix and the release notes rather than opening PDFium, so the ignored pin
          # stays 93.
          #
          # Measured at 524, not 523: U-2 added one non-PDFium guard
          # (`a_reflow_shaped_multi_operand_edit_is_one_undo`), which serialises an inverse and
          # replays it through lopdf rather than opening PDFium, so the ignored pin stays 93.
          #
          # Measured at 523, not 531: R-6 retired `src-tauri/src/editor/undo.rs` (10 tests) and
          # added two (`a_reflow_edit_reaches_the_document_and_its_inverse_restores_it`,
          # `a_vector_leg_refuses_when_its_operations_changed_since`), so 10 - 2 = 8 and the
          # floor falls by exactly that. This is the first move DOWN, and that is why the
          # ignored pin matters: it is unchanged at 93, so no PDFium-backed test was lost with
          # the module. A floor that moves down for any other reason is a lost test.
          #
          # Measured at 531, not 530: T-8b added one non-PDFium guard (530 -> 531), the hand-built
          # `Tz 50` reflow position. It opens the fixture through lopdf rather than PDFium, so it
          # moves this floor and leaves the ignored pin at 93.
          #
          # Measured at 527, not 526: T-8 added one non-PDFium guard (526 -> 527), the hand-built
          # `Tz 50` pen walk. It needs no library and its PDFium sibling is the ignored one above.
          #
          # Measured at 526, not 520: R-3 added six guards (520 -> 526) -- four in
          # `tests/reflow_fixtures.rs` (the §6.2 table parser and its crafted defect shapes, the
          # committed-file check, the A10 topology, and the near-edge room) and two in
          # `testpdf`'s own test module (the committed bytes equal the builder's, and the two
          # variants differ). All six parse a `.pdf` or a `.md` with `std::fs`, so none needs
          # PDFium and the ignored count stays 90.
          # Measured at 520, not 518: R-G1 added two guards (518 -> 520) -- the gate/CI parity
          # comparison and the crafted sample that proves its parser can see a defect. Both read
          # `.github/workflows/ci.yml` and `scripts/ralph/gate.sh` with `std::fs`, so neither
          # needs PDFium and the ignored count stays 90.
          # Measured at 616, not 525: this floor had drifted far below the tree, so a test
          # stopping being collected would have taken 91 deletions to notice. Re-measured
          # from the tree on 2026-11-05 with A-11's six new non-PDFium tests included, and
          # again on 2026-11-07 with A-11b's four stylesheet guards (617 -> 621) and the two
          # release-body guards written while preparing the v1.1.0 tag (621 -> 623), then the
          # notes-link guard written after the tag (623 -> 624), then P3.2 SCOPE-A's eight
          # protect tests (624 -> 627). Re-measured, not incremented, for SCOPE-B's
          # `tests/object_gc.rs`: 627 -> 634, seven tests that build documents in memory and
          # need no library, so this floor moves and the ignored pin above does not. And again
          # for `tests/redact_content.rs`: 634 -> 641, then 641 -> 646 when D-RD2's annotation
          # and image removal arrived with five more tests there, then 646 -> 655 for
          # `tests/sanitize.rs` (D-RD5's seven classes plus the two negative directions),
          # then 655 -> 660 for I-RD7 and the whole-document apply ordering, 660 -> 663 for
          # I-RD6's three idempotence tests, 663 -> 669 for D-RD6's search-and-redact,
          # then 669 -> 675 for SCOPE-C's incremental-append proof (§10 step 1), then
          # 675 -> 684 for `tests/signature_substrate.rs` (the /Contents gap, in-place patching
          # of the range and contents, and I-SG1's independent digest oracle), then 684 -> 697
          # for the PFX importer (8 unit tests) and `tests/signing_surface.rs` (5 source-shape
          # guards for D-SG3 and design K25), then 697 -> 707 for the certificate-store work:
          # `tests/signing_store.rs` adds ten tests that describe the fixture certificate, prove
          # the key/validity filter, the stable picker order and the reported-not-swallowed
          # unreadable entry, and -- off Windows -- prove the listing refuses rather than
          # reporting an empty store. Re-measured, not incremented: the suite was run and the
          # ignored count stayed at 106, so none of the ten is PDFium-gated. Then 707 -> 727 for
          # the CMS signer: `signature/cms.rs` adds 8 unit tests for the gap encoder and the
          # delimiter/bounds refusals, and `tests/sign_pdf.rs` adds 12 end-to-end tests that sign
          # a document and verify it with a hand-written DER walk plus `rsa`'s verifier, plus a
          # sixth `signing_surface.rs` guard confining the CMS crates to `cms.rs`. Measured with
          # PDFium unavailable: 746 passed, 0 ignored. Measured after the save-path unit, which
          # added 18 (8 sign.rs unit tests, 8 sign_save.rs integration tests, 2 cleanup tests).
          #
          # Measured at 838, not 746: the floor had drifted 34 below the tree by the time SCOPE-C's
          # badge unit landed (CI reported 780 passed while this said 746), so a test stopping
          # being collected would have taken 34 deletions to notice. Re-measured from the tree on
          # 2026-11-10: 808 passed with PDFium unavailable, 106 ignored -- the ignored pin above,
          # unchanged, which is why none of the added tests is PDFium-gated. The 28 that this unit
          # added are 13 in `signature/badge.rs`, 8 in `signature/verify.rs`, 6 in
          # `tests/sign_verify.rs` and one new K25 guard in `tests/signing_surface.rs`; the other
          # six were already in the tree and simply unaccounted for by the old number. Then 808 -> 817
          # for the three `cms_verifier::gap_tests` that pin the DER-length rule: a `tests/support`
          # module is compiled into each binary that declares it, and those three live in a module
          # four test binaries include, so three tests move the count by nine. That multiplication is
          # why this number is measured rather than reasoned about.
          #
          # 838 -> 878 for P3.2 SCOPE-C's trust-store unit (+39) and the I-SG5/D-SG7 later-revision
          # seam (+1). Re-measured, not incremented: 878 passed with PDFIUM_LIBRARY_PATH set and
          # 878 with it pointed at a nonexistent path, 106 ignored in both, so the whole delta is
          # PDFium-independent and the ignored pin above correctly does not move.
          #
          # 883 for the I-SG4 unsigned badge: +4, all PDFium-independent (three unit tests and one
          # source guard), so the ignored pin above stays at 106. Measured with the PDFium path
          # unset and pointed at a nonexistent path, 883 in both. Then 884 for the CRLF regression
          # test in `tests/command_registration.rs`, also PDFium-independent.
          #
          # 894 for the I-SG5 edit policy: +10, all PDFium-independent (5 unit tests in
          # `signature/editpolicy.rs`, 5 integration tests in `tests/sign_edit_policy.rs`), so the
          # ignored pin above stays at 106. Re-measured with the PDFium path unset: 894 passed.
          #
          # 897 for `tests/certification_gate.rs`: +3, PDFium-independent, so the ignored pin above
          # stays at 106. Re-measured with the PDFium path unset: 897 passed. Then 898 for the
          # inverse direction of the same guard, so a shrunk GOVERNED list fails too.
          #
          # 913 for D-SG4's trust import: +15, all PDFium-independent, so the ignored pin above
          # stays at 106. Eight unit tests in `editor/signature/trust.rs` and seven integration
          # tests in `tests/trust_store.rs`, including the one that reaches the `valid` badge
          # through the shipped command on a real file. Re-measured with the PDFium path unset:
          # 913 passed, and 1019 when the ignored tests are included as well.
          #
          # (That last number is described rather than spelled out: this step must not contain the
          # ignored-including flag even in prose, and the guard
          # `the_linux_job_does_not_force_pdfium_tests_without_a_library` enforces that as a
          # substring check over the whole step. It caught this comment on the first run.)
          if [ "$passed" -lt 913 ]; then
            echo "::error::only $passed tests ran; 913 is the non-PDFium baseline. A test stopped being collected."
            exit 1
          fi

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs before the build so a failing test is reported as itself rather than as a
      # build failure. `npm ci` fails outright if package-lock and package.json disagree,
      # which is the check that keeps the lockfile honest here.
      - name: Unit tests
        run: npm test

      - run: npm run build

  windows-check:
    name: Windows compile check + render smoke (shipping target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned for the same reason as the `rust` job: an unpinned compiler in the shipping
      # target's check can fail — or start passing — without any code change.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Required *before* any cargo command: tauri-build copies declared bundle
      # resources during the build script, so `tauri.windows.conf.json` declaring
      # resources/pdfium.dll makes the build fail outright when the file is absent.
      - name: Fetch PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      # Compile-only: validates the v1 target without code signing or packaging.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      # The render smoke test (docs/P1-DESIGN.md §5). Linux CI cannot load the Windows
      # DLL, so every PDFium-guarded test skips there and a green suite proves nothing
      # about rendering. This is the only job that exercises the real PDFium code path:
      # rasterization, the render cache under a byte budget, and the memory assertion.
      #
      # PDFIUM_LIBRARY_PATH is set explicitly because the tests run from `target/`, not
      # from the install layout the app resolves the DLL from.
      # `--include-ignored` is load-bearing here and was missing until 0.8.1: all three
      # tests in this file carry `#[ignore]`, so the step reported
      # `0 passed; 0 failed; 3 ignored` and exited 0 on every run since it was written.
      # The step was named after the coverage it did not have. `--nocapture` stays because
      # the point of this step is to see the allocation numbers in the log.
      #
      # The resident-memory test reads 600 pages (~2.5 min locally) so that its leak arm
      # is distinguishable from allocator noise; measured +0 MiB bounded vs +24 MiB with
      # eviction disabled. Do not shorten it to make this step faster -- at 120 pages the
      # unbounded case passed.
      - name: Render smoke tests (real PDFium)
        working-directory: src-tauri
        env:
          PDFIUM_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium.dll
        run: cargo test --test memory -- --include-ignored --nocapture

      # MECH-B's rendering half, and the only place the *shipping* reader is asked whether the
      # embedded subset is a font it can actually draw. Poppler stands in on developer
      # machines, but poppler is a substitute: passing there is weaker evidence and must not
      # be the final word on a font-embed path.
      #
      # Fails closed on purpose. `PdfiumUnavailable` is an error in the test rather than a
      # skip, so a fetch that did not set PDFIUM_LIBRARY_PATH produces a named failure here
      # instead of a green suite that proved nothing. That is the absence-of-evidence shape
      # this programme keeps meeting: a test that did not run looks exactly like a test that
      # passed.
      #
      # The assertion after the run is the same guard used below for the whole suite: the
      # test must appear as `ok`, not merely be absent from the failures.
      - name: Row-1 embedded subset renders through PDFium
        working-directory: src-tauri
        env:
          PDFIUM_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium.dll
        shell: pwsh
        run: |
          $output = cargo test --test embed_acceptance row1_the_embedded_subset_renders_through_pdfium -- --include-ignored --exact 2>&1 | Out-String
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # `--exact` still runs one test, but a name typo would select nothing and exit 0.
          # Require the line libtest prints for a test it actually ran and passed.
          if ($output -notmatch "test row1_the_embedded_subset_renders_through_pdfium \.\.\. ok") {
            Write-Error "the row-1 PDFium test did not report 'ok'; it was skipped, filtered out, or renamed. A font-embed path validated by nothing is not validated."
            exit 1
          }
          # PDFium absent surfaces as a named failure, but check the text explicitly so the
          # diagnosis is in the log rather than inferred from a nonzero exit.
          if ($output -match "PdfiumUnavailable") {
            Write-Error "PDFium was unavailable; PDFIUM_LIBRARY_PATH did not reach the test. Fetching failed, or the DLL is not where the workflow expects it."
            exit 1
          }
          Write-Output "row-1 embed verified through PDFium."

      # A silently-skipped test suite is worse than none: it looks green while testing
      # nothing. Fail loudly if the guards turned out to be tripping.
      #
      # Both halves of the check are load-bearing.
      #
      # `--include-ignored` is what makes this a real run: PDFium-gated tests carry
      # `#[ignore = "requires a real PDFium library..."]`, so a plain `cargo test` would
      # skip all 79 of them and the only evidence they ran would be that they did not
      # complain. This job exists precisely to fetch the library, so it asks for them.
      #
      # `--no-run`-free parsing is not enough on its own: this assertion previously grepped
      # for "skipping: PDFium" in plain `cargo test` output, where libtest *captures* the
      # stdout of passing tests. The pattern could therefore never match, and the check
      # passed on every run regardless of what the tests did. Counting libtest's own
      # `ignored` total is a number the harness produces, not a string it hopes appears.
      - name: Assert the PDFium tests actually ran
        working-directory: src-tauri
        env:
          PDFIUM_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium.dll
        shell: pwsh
        run: |
          $output = cargo test -- --include-ignored 2>&1 | Out-String
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # libtest reports `N passed; M failed; K ignored`. With PDFium fetched and
          # `--include-ignored` passed, nothing may remain ignored: an ignored test here
          # is a test that would have run on a developer machine but not on this one.
          $ignored = 0
          foreach ($match in [regex]::Matches($output, "(\d+) ignored")) {
            $ignored += [int]$match.Groups[1].Value
          }
          if ($ignored -gt 0) {
            Write-Error "PDFium tests were ignored ($ignored) despite --include-ignored; the installer would ship unvalidated"
            exit 1
          }

          # A suite that ran no tests also reports success.
          $passed = 0
          foreach ($match in [regex]::Matches($output, "(\d+) passed")) {
            $passed += [int]$match.Groups[1].Value
          }
          if ($passed -lt 400) {
            Write-Error "Only $passed tests ran; expected the full suite"
            exit 1
          }
          Write-Output "PDFium tests ran: $passed passed, 0 ignored."
