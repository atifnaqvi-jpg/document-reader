name: Release (Windows installer)

# Builds the NSIS installer on a real Windows runner — the only supported way to
# produce a Windows binary for this project (see docs/DECISIONS.md: Windows-only v1).
#
# Tags publish as **full releases** as of 1.0.0 (P2.8). Every phase between 0.6.0 and 0.9.0
# was an intermediate step, so each of those tags was published as a pre-release: P2.7.4 and
# P2.7.6 were still unreleased and a "latest release" badge would have claimed more than the
# build delivered. 1.0.0 completes text editing, so the flag is flipped and
# `tests/release_workflow.rs` is flipped with it -- the flag and its guard move together, or
# one of them is asserting something the other denies.
#
# Tag a commit to publish a downloadable installer:
#   git tag v0.5.0 && git push origin v0.5.0
# Or run manually from the Actions tab (workflow_dispatch), which keeps the
# installer as a build artifact without creating a release.
#
# Both tag conventions used by this repository are accepted (`v0.1.0` and
# `version-0.4.4`), but only those two shapes: the digit after the prefix is what
# separates a release tag from a marker like `vnext` or `verify-ci`. A bare `v*`
# also matches those, which spends a Windows build on each and -- because the
# attach step below then publishes -- creates a release named after the stray tag.
# `tests/release_workflow.rs` pins both halves of that.

on:
  push:
    tags:
      - "v[0-9]*"
      - "version-[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Same pin as .github/workflows/ci.yml: the installer must be built by the same
      # compiler that the gates were defined against, or "green in CI" describes a
      # different build than the one users download.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Verify PDFium is in place
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/resources/pdfium.dll")) {
            throw "pdfium.dll missing; the installer would ship without PDF support"
          }
          Get-Item "src-tauri/resources/pdfium.dll" | Select-Object Name, Length

      # PDFium is fetched into `src-tauri/resources/`, but the tests run from `target/`
      # and the app's resolver only looks next to the executable, so the path has to be
      # given explicitly. Without it every PDFium-guarded test skips itself and the whole
      # rendering path — rasterization, the cache's byte budget, the memory assertion —
      # goes unvalidated in the very build that produces the shipped installer.
      - name: Run tests
        working-directory: src-tauri
        env:
          PDFIUM_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium.dll
        run: cargo test

      # A skipped suite looks exactly like a passing one. This is the check that tells
      # them apart, so it is worth failing the release over.
      #
      # `--include-ignored` because PDFium-gated tests carry `#[ignore]`: without it this
      # step would skip 71 tests and the only evidence they ran is that they said nothing.
      # The count comes from libtest's own summary rather than a grep for a skip message,
      # which libtest captures for passing tests and so can never match.
      - name: Assert the PDFium tests actually ran
        working-directory: src-tauri
        env:
          PDFIUM_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium.dll
        shell: pwsh
        run: |
          $output = cargo test -- --include-ignored 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Output $output; exit $LASTEXITCODE }

          $ignored = 0
          foreach ($match in [regex]::Matches($output, "(\d+) ignored")) {
            $ignored += [int]$match.Groups[1].Value
          }
          if ($ignored -gt 0) {
            Write-Error "PDFium tests were ignored ($ignored) despite --include-ignored; the installer would ship unvalidated"
            exit 1
          }

          $passed = 0
          foreach ($match in [regex]::Matches($output, "(\d+) passed")) {
            $passed += [int]$match.Groups[1].Value
          }
          if ($passed -lt 400) {
            Write-Error "Only $passed tests ran; expected the full suite"
            exit 1
          }
          Write-Output "PDFium tests ran: $passed passed, 0 ignored."

      - name: Build installer
        run: npm run tauri build

      - name: Collect installer paths
        id: installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe"
          if (-not $installers) { throw "No NSIS installer was produced" }
          $installers | ForEach-Object { Write-Host $_.FullName }
          "path=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: document-reader-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        # Only a tag run publishes; `workflow_dispatch` keeps its artifact instead. Which tags
        # can reach this step is decided by the `on.push.tags` globs above -- this guard only
        # separates a tag ref from a branch ref, because GitHub expressions have no way to
        # express "the tag name starts with a version".
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          prerelease: false
          # The headline is written per tag, not once. v1.0.1 published with 1.0.0's
          # headline still in place -- "Document Reader 1.0.0 -- line-level reflow" under a
          # tag three phases past it -- because the string was hardcoded and no guard read it.
          # Describe the version this tag publishes; `generate_release_notes: true` still adds
          # the commit list below it.
          #
          # The notes link is pinned to `github.ref_name`, not to `main`. It pointed at `main`
          # until v1.1.0, and `main` is 67 commits behind and its newest section is 0.9.0 -- so
          # v1.0.0, v1.0.1 and v1.1.0 all linked to a page that never mentioned their release.
          # A tag ref cannot rot the same way: the notes at the tag are the notes for it.
          body: |
            **Document Reader 1.1.0** — annotation breadth: thirteen annotation types, a
            comment pane with statuses and reply chains, XFDF import/export, and search that
            resolves an annotation rather than only its page. See
            [the release notes](https://github.com/atifnaqvi-jpg/document-reader/blob/${{ github.ref_name }}/docs/RELEASE-NOTES.md)
            for what changed, what is still refused, and the phase's acceptance record.

            Windows installer for Document Reader ${{ github.ref_name }}.

            Download the `.exe` below and run it. Per-user install, no admin
            rights needed. PDFium is bundled, so PDF support works out of the box.
